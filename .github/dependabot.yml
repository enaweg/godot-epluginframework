version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns:
          - "*"
    commit-message:
      prefix: "chore(deps)"
  - package-ecosystem: nuget
    directory: "/src/eplugin-framework"
    schedule:
      interval: weekly
    groups:
      test-dependencies:
        patterns:
          - "gdUnit4.*"
          - "Microsoft.NET.Test.Sdk"
          - "Moq"
    commit-message:
      prefix: "chore(deps)"
  - package-ecosystem: nuget
    directory: "/src/activation-progress.Tests"
    schedule:
      interval: weekly
    groups:
      test-dependencies:
        patterns:
          - "Microsoft.NET.Test.Sdk"
          - "xunit*"
    commit-message:
      prefix: "chore(deps)"

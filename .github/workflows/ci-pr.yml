name: CI-PR

on:
  pull_request:

jobs:
  progress-helper:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      DOTNET_NOLOGO: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Smoke test progress helper
        shell: bash
        run: |
          temp="$RUNNER_TEMP"
          if [[ "$RUNNER_OS" == Windows ]]; then
            temp="$(cygpath -u "$temp")"
          fi
          output="$temp/activation-progress"
          dotnet publish src/activation-progress/ActivationProgress.csproj \
            --configuration Release -p:DebugType=None --output "$output"
          test "$(find "$output" -maxdepth 1 -type f | wc -l)" -eq 2
          python="$(command -v python || command -v python3)"
          "$python" src/activation-progress/smoke.py dotnet "$output/ActivationProgress.dll"

  build-and-test:
    runs-on: ubuntu-latest
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      DOTNET_NOLOGO: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Setup Godot .NET
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: true

      - name: Configure Godot test executable
        shell: bash
        run: echo "GODOT_BIN=$GODOT" >> "$GITHUB_ENV"

      - name: Install Xvfb and GTK 3
        run: |
          sudo apt-get update
          sudo apt-get install --yes xvfb libgtk-3-0

      - name: Build
        working-directory: src/eplugin-framework
        run: dotnet build "EPlugin Framework.sln" --configuration Debug

      - name: Smoke test progress helper
        run: |
          dotnet publish src/activation-progress/ActivationProgress.csproj \
            --configuration Release -p:DebugType=None --output "$RUNNER_TEMP/activation-progress"
          test "$(find "$RUNNER_TEMP/activation-progress" -maxdepth 1 -type f | wc -l)" -eq 2
          xvfb-run --auto-servernum python3 src/activation-progress/smoke.py \
            dotnet "$RUNNER_TEMP/activation-progress/ActivationProgress.dll"

      - name: Rebuild Godot project cache
        working-directory: src/eplugin-framework
        run: |
          "$GODOT_BIN" --path . --editor --headless --quit-after 2000

      - name: Run tests
        working-directory: src/eplugin-framework
        run: |
          xvfb-run --auto-servernum --server-args="-screen 0 1024x768x24" \
            dotnet test "EPlugin Framework.sln" --configuration Debug --no-build --settings .runsettings --verbosity normal -m:1

name: CI-PR

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A new push to a pull request cancels the run of the previous one, so an older run never overwrites the CI comment of a
# newer one. Pushes to main each get their own group and always run to the end.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  package:
    # The pull request's test build; it posts the CI comment early with the download link.
    if: ${{ github.event_name == 'pull_request' }}
    uses: ./.github/workflows/ci-pr-build.yml
    permissions:
      contents: read
      pull-requests: write

  analysis:
    # CI-Analysis runs the same jobs for main.
    if: ${{ github.event_name == 'pull_request' }}
    uses: ./.github/workflows/ci-analysis-jobs.yml
    permissions:
      contents: read
      security-events: write

  progress-helper:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      DOTNET_NOLOGO: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup .NET for the tools
        # The C# tools under tools/ need .NET 10. A separate installation, so the SDK below still decides what builds and
        # tests the helper.
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        env:
          DOTNET_INSTALL_DIR: ${{ runner.temp }}/dotnet-tools
        with:
          dotnet-version: 10.0.x

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: 8.0.x

      - name: Test progress helper commands
        run: dotnet test src/activation-progress.Tests/ActivationProgress.Tests.csproj

      - name: Smoke test progress helper
        shell: bash
        run: |
          temp="$RUNNER_TEMP"
          if [[ "$RUNNER_OS" == Windows ]]; then
            temp="$(cygpath -u "$temp")"
          fi
          output="$temp/activation-progress"
          dotnet publish src/activation-progress/ActivationProgress.csproj \
            --configuration Release -p:DebugType=None --output "$output"
          test "$(find "$output" -maxdepth 1 -type f | wc -l)" -eq 2
          "$temp/dotnet-tools/dotnet" run tools/progress_smoke.cs -- dotnet "$output/ActivationProgress.dll"

  build-and-test:
    # The installed SDK decides which dotnet CLI generation ePlugin uses (DotnetCli9 or DotnetCli10).
    strategy:
      fail-fast: false
      matrix:
        include:
          - sdk: dotnet8
            dotnet: 8.0.x
          # the newest installed SDK is used; the .NET 8 runtime runs the net8.0 test host
          - sdk: dotnet10
            dotnet: |
              8.0.x
              10.0.x
    name: build-and-test (${{ matrix.sdk }})
    runs-on: ubuntu-latest
    # A headless editor that does not quit would otherwise hold the runner for six hours.
    timeout-minutes: 30
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      DOTNET_NOLOGO: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup .NET for the tools
        # The C# tools under tools/ need .NET 10. A separate installation, so the SDK below still decides what builds and
        # tests the project (and which dotnet CLI generation ePlugin uses).
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        env:
          DOTNET_INSTALL_DIR: ${{ runner.temp }}/dotnet-tools
        with:
          dotnet-version: 10.0.x

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: ${{ matrix.dotnet }}

      - name: Setup Godot .NET
        uses: chickensoft-games/setup-godot@ac93246ea68518a384c1c280a496e5989341f2f6 # v2
        with:
          version: 4.7.2
          use-dotnet: true

      - name: Configure Godot test executable
        shell: bash
        run: echo "GODOT_BIN=$GODOT" >> "$GITHUB_ENV"

      - name: Install Xvfb and GTK 3
        run: |
          sudo apt-get update
          sudo apt-get install --yes xvfb libgtk-3-0

      - name: Build
        working-directory: src/eplugin-framework
        run: |
          dotnet --version
          dotnet build "EPluginFramework.sln" --configuration Debug

      - name: Test progress helper commands
        run: dotnet test src/activation-progress.Tests/ActivationProgress.Tests.csproj

      - name: Smoke test progress helper
        run: |
          dotnet publish src/activation-progress/ActivationProgress.csproj \
            --configuration Release -p:DebugType=None \
            --output src/eplugin-framework/addons/ePlugin/progress
          test "$(find src/eplugin-framework/addons/ePlugin/progress -maxdepth 1 -type f -name 'ActivationProgress.*' | wc -l)" -eq 2
          xvfb-run --auto-servernum "$RUNNER_TEMP/dotnet-tools/dotnet" run tools/progress_smoke.cs -- \
            dotnet src/eplugin-framework/addons/ePlugin/progress/ActivationProgress.dll

      - name: Rebuild Godot project cache
        working-directory: src/eplugin-framework
        run: |
          "$GODOT_BIN" --path . --editor --headless --quit-after 2000

      - name: Install dotnet-coverage
        run: |
          dotnet tool install --global dotnet-coverage --version 18.12.0
          echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"

      - name: Run tests with coverage
        # Godot loads the project assembly from memory, out of reach of `dotnet test --collect`; the tool instruments
        # the built assembly instead, runs dotnet test (with the dotnet on PATH) and restores it.
        env:
          REPORT: ${{ runner.temp }}/coverage/${{ matrix.sdk }}.cobertura.xml
        run: |
          xvfb-run --auto-servernum --server-args="-screen 0 1024x768x24" \
            "$RUNNER_TEMP/dotnet-tools/dotnet" run tools/coverage.cs -- "$REPORT" --verbosity normal -m:1

      - name: Upload coverage report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: coverage-${{ matrix.sdk }}
          path: ${{ runner.temp }}/coverage/${{ matrix.sdk }}.cobertura.xml
          if-no-files-found: warn
          retention-days: 14

  coverage:
    # Merges the SDK runs (each covers its own dotnet CLI generation) and reports them in the run summary and in the
    # pull request's CI comment, compared with the latest main measurement on the coverage branch.
    needs: build-and-test
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      DOTNET_NOLOGO: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # A pull request checks out its merge commit; its first parent is the base for the changed lines.
          fetch-depth: 2

      - name: Download coverage reports
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: coverage-dotnet*
          path: coverage
          merge-multiple: true

      - name: Fetch the latest main measurement
        if: ${{ hashFiles('coverage/*.cobertura.xml') != '' }}
        run: |
          if git ls-remote --exit-code --heads origin coverage > /dev/null; then
            git fetch --depth=1 origin coverage
            git show FETCH_HEAD:latest.json > "$RUNNER_TEMP/baseline.json"
          else
            echo "No coverage branch yet."
          fi

      - name: Diff the pull request
        if: ${{ github.event_name == 'pull_request' && hashFiles('coverage/*.cobertura.xml') != '' }}
        run: git diff --unified=0 HEAD^1 HEAD -- src/eplugin-framework/addons/ePlugin > "$RUNNER_TEMP/pr.diff"

      - name: Setup .NET
        if: ${{ hashFiles('coverage/*.cobertura.xml') != '' }}
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          # 8 for ReportGenerator, 10 for the coverage report tool (tools/ci-reports).
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Create HTML report
        if: ${{ hashFiles('coverage/*.cobertura.xml') != '' }}
        run: |
          dotnet tool install --global dotnet-reportgenerator-globaltool --version 5.5.11
          "$HOME/.dotnet/tools/reportgenerator" "-reports:coverage/*.cobertura.xml" \
            -targetdir:artifacts/coverage/html -reporttypes:Html "-title:ePlugin Framework"

      - name: Upload HTML report
        id: html
        if: ${{ hashFiles('coverage/*.cobertura.xml') != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: coverage-report
          path: artifacts/coverage/html
          retention-days: 14

      - name: Summarize coverage
        id: summary
        if: ${{ hashFiles('coverage/*.cobertura.xml') != '' }}
        env:
          LABEL: ${{ github.event_name == 'pull_request' && 'This pull request' || 'This push' }}
          COMMIT: ${{ github.sha }}
          REPOSITORY_URL: ${{ github.server_url }}/${{ github.repository }}
          HTML_URL: ${{ steps.html.outputs.artifact-url }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          args=()
          for report in coverage/*.cobertura.xml; do args+=(--report "$report"); done
          if [[ -s "$RUNNER_TEMP/baseline.json" ]]; then args+=(--baseline "$RUNNER_TEMP/baseline.json"); fi
          if [[ -f "$RUNNER_TEMP/pr.diff" ]]; then args+=(--diff "$RUNNER_TEMP/pr.diff"); fi
          dotnet run --project tools/ci-reports -- coverage summary "${args[@]}" --root "$GITHUB_WORKSPACE" \
            --commit "$COMMIT" --label "$LABEL" --repository-url "$REPOSITORY_URL" \
            --html-url "$HTML_URL" --run-url "$RUN_URL" --output-dir artifacts/coverage
          cat artifacts/coverage/summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload measurement
        if: ${{ steps.summary.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: coverage-summary
          path: |
            artifacts/coverage/coverage.json
            artifacts/coverage/summary.md
          retention-days: 14

      - name: Upload the pull request comment section
        if: ${{ steps.summary.outcome == 'success' && github.event_name == 'pull_request' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: pr-comment-coverage
          path: artifacts/coverage/summary.md
          retention-days: 1

  pr-comment:
    # Replaces the early CI comment of the package job with the result of every job and the reports of the test build,
    # static analysis and code coverage. Fork pull requests get a read-only token; their reports are in the run summary.
    needs: [package, analysis, progress-helper, build-and-test, coverage, godot-compatibility]
    if: ${{ !cancelled() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      DOTNET_NOLOGO: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Download the comment sections
        # A job that failed early uploaded no section; the comment then shows only its result.
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        continue-on-error: true
        with:
          pattern: pr-comment-*
          path: ${{ runner.temp }}/pr-comment

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: 10.0.x

      - name: Compose the pull request comment
        env:
          SECTIONS: ${{ runner.temp }}/pr-comment
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          PACKAGE: ${{ needs.package.result }}
          ANALYSIS: ${{ needs.analysis.result }}
          PROGRESS_HELPER: ${{ needs.progress-helper.result }}
          TESTS: ${{ needs.build-and-test.result }}
          COVERAGE: ${{ needs.coverage.result }}
          COMPATIBILITY: ${{ needs.godot-compatibility.result }}
        run: |
          dotnet run --project tools/ci-reports -- comment --output "$RUNNER_TEMP/pr-comment.md" \
            --commit "$HEAD_SHA" --run-url "$RUN_URL" \
            --job "Test build=$PACKAGE" --job "Tests (.NET 8, .NET 10)=$TESTS" \
            --job "Progress helper (Windows, macOS)=$PROGRESS_HELPER" --job "Godot 4.4 to 4.6 build=$COMPATIBILITY" \
            --job "Static analysis and workflow lint=$ANALYSIS" --job "Code coverage=$COVERAGE" \
            --section "$SECTIONS/pr-comment-build/build.md" \
            --section "$SECTIONS/pr-comment-analysis/summary.md" \
            --section "$SECTIONS/pr-comment-coverage/summary.md"

      - name: Update the pull request comment
        uses: ./.github/actions/pr-comment
        with:
          body-file: ${{ runner.temp }}/pr-comment.md
          pr-number: ${{ github.event.pull_request.number }}

  coverage-history:
    # Records each main measurement on the generated coverage branch (README with trend chart, history.csv, badge),
    # which pull requests compare against. Only runs of trusted main code get the write token.
    needs: [build-and-test, coverage]
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.build-and-test.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    concurrency:
      group: coverage-history
      cancel-in-progress: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: 10.0.x

      - name: Download measurement
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: coverage-summary
          path: ${{ runner.temp }}/coverage

      - name: Record the measurement on the coverage branch
        env:
          COMMIT: ${{ github.sha }}
          REPOSITORY_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          history="$RUNNER_TEMP/history"
          if git ls-remote --exit-code --heads origin coverage > /dev/null; then
            git fetch --depth=1 origin coverage
            git worktree add --detach "$history" FETCH_HEAD
          else
            git worktree add --orphan -b coverage "$history"
          fi
          dotnet run --project tools/ci-reports -- coverage history --coverage "$RUNNER_TEMP/coverage/coverage.json" \
            --branch-dir "$history" --repository-url "$REPOSITORY_URL"
          git -C "$history" add --all
          git -C "$history" commit --quiet -m "chore: record coverage of ${COMMIT:0:7}"
          git -C "$history" push origin HEAD:coverage

  godot-compatibility:
    # The framework supports Godot 4.4 to 4.7; tests run on 4.7, the older Godot APIs are compiled against here.
    strategy:
      fail-fast: false
      matrix:
        godot: [4.4.1, 4.5.1, 4.6.2]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      DOTNET_NOLOGO: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: 10.0.x

      - name: Build against Godot ${{ matrix.godot }}
        working-directory: src/eplugin-framework
        run: |
          sed -i -E "s|Godot.NET.Sdk/[0-9.]+|Godot.NET.Sdk/${{ matrix.godot }}|" EPluginFramework.csproj
          dotnet build "EPluginFramework.sln" --configuration Debug

name: CI-PR

on:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      DOTNET_NOLOGO: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Setup Godot .NET
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: true

      - name: Configure Godot test executable
        shell: bash
        run: echo "GODOT_BIN=$GODOT" >> "$GITHUB_ENV"

      - name: Install Xvfb
        run: |
          sudo apt-get update
          sudo apt-get install --yes xvfb

      - name: Build
        working-directory: src/eplugin-framework
        run: dotnet build "EPlugin Framework.sln" --configuration Debug

      - name: Build progress helper
        run: dotnet build src/activation-progress/ActivationProgress.csproj --configuration Release

      - name: Smoke test single-file progress helper
        run: |
          dotnet publish src/activation-progress/ActivationProgress.csproj \
            --configuration Release --runtime linux-x64 --self-contained true \
            -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true \
            -p:PublishTrimmed=false -p:DebugType=None --output "$RUNNER_TEMP/activation-progress"
          test "$(find "$RUNNER_TEMP/activation-progress" -maxdepth 1 -type f | wc -l)" -eq 1
          xvfb-run --auto-servernum python3 src/activation-progress/smoke.py \
            "$RUNNER_TEMP/activation-progress/ActivationProgress"

      - name: Rebuild Godot project cache
        working-directory: src/eplugin-framework
        run: |
          "$GODOT_BIN" --path . --editor --headless --quit-after 2000

      - name: Run tests
        working-directory: src/eplugin-framework
        run: |
          xvfb-run --auto-servernum --server-args="-screen 0 1024x768x24" \
            dotnet test "EPlugin Framework.sln" --configuration Debug --no-build --settings .runsettings --verbosity normal -m:1

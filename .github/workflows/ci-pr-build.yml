name: CI-PR-Build

# Packages the plugin of every pull request like a release, so it can be downloaded and tried in a project. The
# version gets the PR number as a prerelease: 0.9.1 -> 0.9.1-pr.42, 1.0.0-rc.1+build.5 -> 1.0.0-rc.1.pr.42+build.5.
# A PR build therefore sorts before the release of the same version, and the updater still offers that release.
# CI-PR calls it for pull requests. It posts the download link as the pull request's CI comment right away, and CI-PR's
# pr-comment job replaces that comment with all results once the other jobs finish.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      DOTNET_NOLOGO: true
      PLUGIN_CFG: src/eplugin-framework/addons/ePlugin/plugin.cfg
      PR_NUMBER: ${{ github.event.pull_request.number }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup .NET for the tools
        # tools/ci-reports needs .NET 10. A separate installation, so the SDK below still builds the package.
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        env:
          DOTNET_INSTALL_DIR: ${{ runner.temp }}/dotnet-tools
        with:
          dotnet-version: 10.0.x

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: 8.0.x

      - name: Build
        working-directory: src/eplugin-framework
        run: dotnet build "EPluginFramework.sln" --configuration Debug

      - name: Initialize version
        shell: bash
        run: |
          # Semantic Versioning 2.0.0 (https://semver.org), without the leading v that tags have.
          id='(0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*)'
          semver="^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-$id(\.$id)*)?(\+[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?\$"
          base="$(sed -n -E 's/^version="([^"]*)"[[:space:]]*$/\1/p' "$PLUGIN_CFG")"
          if [[ ! "$base" =~ $semver ]]; then
            echo "::error file=$PLUGIN_CFG::version=\"$base\" is not a semantic version (MAJOR.MINOR.PATCH[-PRERELEASE][+BUILD])"
            exit 1
          fi
          # Only build metadata may contain '+', and the first '-' outside it starts the prerelease.
          build=""
          if [[ "$base" == *+* ]]; then build="+${base#*+}"; fi
          rest="${base%%+*}"
          core="${rest%%-*}"
          prerelease=""
          if [[ "$rest" == *-* ]]; then prerelease="${rest#*-}."; fi
          version="$core-${prerelease}pr.$PR_NUMBER$build"
          [[ "$version" =~ $semver ]] || { echo "::error::Computed version $version is not a semantic version"; exit 1; }
          echo "Plugin version: $base -> $version"
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Set version in plugin.cfg
        shell: bash
        run: |
          sed -i -E "s/^version=\"[^\"]*\"/version=\"$VERSION\"/" "$PLUGIN_CFG"
          grep -qFx "version=\"$VERSION\"" "$PLUGIN_CFG"

      - name: Publish progress helper
        shell: bash
        run: |
          # Framework-dependent and RID-neutral: one assembly serves every platform.
          dotnet publish src/activation-progress/ActivationProgress.csproj \
            --configuration Release -p:DebugType=None \
            --output src/eplugin-framework/addons/ePlugin/progress
          test "$(find src/eplugin-framework/addons/ePlugin/progress -maxdepth 1 -type f -name 'ActivationProgress.*' | wc -l)" -eq 2

      - name: Create artifact
        shell: bash
        run: |
          mkdir -p out
          cd src/eplugin-framework
          zip -r "../../out/ePlugin-v${VERSION}.zip" addons/ePlugin

      - name: Upload artifact
        id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          path: out/ePlugin-v${{ env.VERSION }}.zip
          archive: false
          if-no-files-found: error

      - name: Write download summary
        shell: bash
        env:
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          mkdir -p "$RUNNER_TEMP/pr-comment"
          {
            echo "### ePlugin test build"
            echo
            echo "[ePlugin-v${VERSION}.zip](${ARTIFACT_URL}) (version \`${VERSION}\`, commit ${HEAD_SHA:0:7})"
            echo
            echo "Extract its \`addons/ePlugin\` directory into your project's \`addons\` directory, build the project and enable"
            echo "**ePlugin** under **Project > Project Settings > Plugins**. Downloading requires a GitHub login."
          } > "$RUNNER_TEMP/pr-comment/build.md"
          cat "$RUNNER_TEMP/pr-comment/build.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the comment section
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: pr-comment-build
          path: ${{ runner.temp }}/pr-comment/build.md
          retention-days: 1

      - name: Compose the early pull request comment
        # Fork pull requests get a read-only token; their download link is in the run summary.
        if: github.event.pull_request.head.repo.full_name == github.repository
        shell: bash
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          "$RUNNER_TEMP/dotnet-tools/dotnet" run --project tools/ci-reports -- comment \
            --output "$RUNNER_TEMP/pr-comment.md" --commit "$HEAD_SHA" --run-url "$RUN_URL" \
            --job "Test build=success" --section "$RUNNER_TEMP/pr-comment/build.md" \
            --note "Tests, static analysis and code coverage are still running. This comment is updated when they finish."

      - name: Post the download link on the pull request
        if: github.event.pull_request.head.repo.full_name == github.repository
        uses: ./.github/actions/pr-comment
        with:
          body-file: ${{ runner.temp }}/pr-comment.md
          pr-number: ${{ github.event.pull_request.number }}

name: CI-Analysis

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: analysis-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  managed-analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
      pull-requests: write
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      DOTNET_NOLOGO: true
    steps:
      - name: Checkout repository
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          # Update deliberately: this SDK matches the reviewed analyzer baseline.
          dotnet-version: 10.0.401

      - name: Check analysis reporting
        run: dotnet test tools/ci-reports.Tests/CiReports.Tests.csproj

      - name: Restore and audit the Godot project
        id: restore_framework
        run: |
          dotnet restore src/eplugin-framework/EPluginFramework.sln --force \
            -p:NuGetAudit=true -p:NuGetAuditMode=all -p:NuGetAuditLevel=high \
            -warnaserror:NU1900,NU1903,NU1904

      - name: Restore and audit the progress helper and tests
        id: restore_helper
        run: |
          dotnet restore src/activation-progress.Tests/ActivationProgress.Tests.csproj --force \
            -p:NuGetAudit=true -p:NuGetAuditMode=all -p:NuGetAuditLevel=high \
            -warnaserror:NU1900,NU1903,NU1904

      - name: Create report directory
        id: report_directory
        run: mkdir -p artifacts/static-analysis

      - name: Analyze the Godot editor project
        id: build_framework
        # Debug defines TOOLS; export configurations omit most framework code.
        run: |
          dotnet build src/eplugin-framework/EPluginFramework.sln \
            --configuration Debug --no-restore --no-incremental -p:CIStaticAnalysis=true

      - name: Analyze the progress helper and tests
        id: build_helper
        # Still analyze the other projects if the Godot build fails.
        if: ${{ !cancelled() && steps.restore_helper.outcome == 'success' && steps.report_directory.outcome == 'success' }}
        run: |
          dotnet build src/activation-progress.Tests/ActivationProgress.Tests.csproj \
            --configuration Debug --no-restore --no-incremental -p:CIStaticAnalysis=true

      - name: Publish analysis counts and source annotations
        id: report
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        env:
          RESTORE_FRAMEWORK: ${{ steps.restore_framework.outcome }}
          RESTORE_HELPER: ${{ steps.restore_helper.outcome }}
          BUILD_FRAMEWORK: ${{ steps.build_framework.outcome }}
          BUILD_HELPER: ${{ steps.build_helper.outcome }}
          ANALYSIS_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: dotnet run --project tools/ci-reports -- analysis

      - name: Upload owned-code findings to GitHub code scanning
        if: ${{ !cancelled() && steps.report.outputs.reports_complete == 'true' }}
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4
        with:
          sarif_file: artifacts/static-analysis/github.sarif
          category: dotnet

      - name: Update the pull request analysis summary
        # Forks have a read-only token; their counts remain in checks and the run summary.
        if: ${{ !cancelled() && steps.report.outcome == 'success' && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          comment="$(gh api --paginate "repos/$REPOSITORY/issues/$PR_NUMBER/comments" \
            --jq '.[] | select(.user.login == "github-actions[bot]" and (.body | startswith("<!-- eplugin-static-analysis -->"))) | .id' | head -n 1)"
          if [[ -n "$comment" ]]; then
            gh api --method PATCH "repos/$REPOSITORY/issues/comments/$comment" \
              -F "body=@artifacts/static-analysis/summary.md" > /dev/null
          else
            gh api --method POST "repos/$REPOSITORY/issues/$PR_NUMBER/comments" \
              -F "body=@artifacts/static-analysis/summary.md" > /dev/null
          fi

      - name: Preserve reports and machine-readable counts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: managed-analysis
          path: |
            artifacts/static-analysis/*.sarif
            artifacts/static-analysis/metrics.json
            artifacts/static-analysis/summary.md
          if-no-files-found: warn
          retention-days: 14

  workflow-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Check workflows and embedded shell scripts
        id: lint
        uses: docker://rhysd/actionlint@sha256:6f03470d0152251d7f07f7c4dc019dbe7024c72cd952f839544c7798843efa8f # 1.7.11

      - name: Summarize workflow lint
        if: always()
        env:
          LINT_STATUS: ${{ steps.lint.outcome }}
        run: |
          printf '### Workflow lint\n\nactionlint and ShellCheck: **%s**\n' "$LINT_STATUS" >> "$GITHUB_STEP_SUMMARY"

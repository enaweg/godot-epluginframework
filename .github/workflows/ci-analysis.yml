name: CI-Analysis

# Static analysis of main and manual dispatch, for the README badge. The jobs are in CI-Analysis-Jobs, which CI-PR calls
# for pull requests; this workflow must not get a workflow_call trigger itself, or its badge shows no status.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analysis:
    uses: ./.github/workflows/ci-analysis-jobs.yml
    permissions:
      contents: read
      security-events: write

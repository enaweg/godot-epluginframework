name: CI-CodeQL

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '23 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  codeql-csharp:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      DOTNET_NOLOGO: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6
        with:
          dotnet-version: 10.0.401

      - name: Initialize CodeQL
        uses: github/codeql-action/init@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4
        with:
          languages: csharp
          build-mode: manual
          queries: security-extended

      - name: Build the Godot editor project under tracing
        # Debug includes TOOLS and Godot's generated code in the extraction.
        run: |
          dotnet build src/eplugin-framework/EPluginFramework.sln \
            --configuration Debug --no-incremental

      - name: Build the progress helper and tests under tracing
        run: |
          dotnet build src/activation-progress.Tests/ActivationProgress.Tests.csproj \
            --configuration Debug --no-incremental

      - name: Analyze and upload security results
        uses: github/codeql-action/analyze@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4
        with:
          category: /language:csharp

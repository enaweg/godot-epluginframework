name: CI-Release

on:
  push:
    tags:
      - "v*"

jobs:
  draft-release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: read
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      DOTNET_NOLOGO: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 200
          fetch-tags: true
          # Nothing here pushes with git; the release steps get the token as an input. Without it in .git/config,
          # the build's packages and tools cannot reach it.
          persist-credentials: false

      - name: Setup .NET for the tools
        # The C# tools under tools/ need .NET 10. A separate installation, so the SDK below still decides what builds, tests
        # and publishes the release.
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        env:
          DOTNET_INSTALL_DIR: ${{ runner.temp }}/dotnet-tools
        with:
          dotnet-version: 10.0.x

      - name: Setup .NET
        # Its own installation directory: the runner image's has newer SDKs, and dotnet always picks the newest one.
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        env:
          DOTNET_INSTALL_DIR: ${{ runner.temp }}/dotnet
        with:
          dotnet-version: 8.0.x

      - name: Setup Godot .NET
        uses: chickensoft-games/setup-godot@ac93246ea68518a384c1c280a496e5989341f2f6 # v2
        with:
          version: 4.7.2
          use-dotnet: true

      - name: Configure Godot test executable
        shell: bash
        run: echo "GODOT_BIN=$GODOT" >> "$GITHUB_ENV"

      - name: Install Xvfb and GTK 3
        run: |
          sudo apt-get update
          sudo apt-get install --yes xvfb libgtk-3-0

      - name: Build
        working-directory: src/eplugin-framework
        run: dotnet build "EPluginFramework.sln" --configuration Debug

      - name: Rebuild Godot project cache
        working-directory: src/eplugin-framework
        run: |
          "$GODOT_BIN" --path . --editor --headless --quit-after 2000

      - name: Run tests
        working-directory: src/eplugin-framework
        run: |
          xvfb-run --auto-servernum --server-args="-screen 0 1024x768x24" \
            dotnet test "EPluginFramework.sln" --configuration Debug --no-build --settings .runsettings --verbosity normal -m:1

      - name: Initialize version
        shell: bash
        run: |
          # The tag without its leading v, prerelease suffix included (v1.2.0-beta.1 -> 1.2.0-beta.1), so the
          # released plugin.cfg is a prerelease to the updater as well. Semantic Versioning 2.0.0, as the PR build checks,
          # or the updater cannot compare it.
          version="${GITHUB_REF_NAME#v}"
          id='(0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*)'
          semver="^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-$id(\.$id)*)?(\+[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?\$"
          if [[ ! "$version" =~ $semver ]]; then
            echo "::error::Tag $GITHUB_REF_NAME is not v followed by a semantic version (MAJOR.MINOR.PATCH[-PRERELEASE][+BUILD])"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Set version in plugin.cfg
        shell: bash
        env:
          PLUGIN_CFG: src/eplugin-framework/addons/ePlugin/plugin.cfg
        run: |
          sed -i -E "s/^version=\"[^\"]*\"/version=\"$VERSION\"/" "$PLUGIN_CFG"
          grep -qFx "version=\"$VERSION\"" "$PLUGIN_CFG"

      - name: Publish progress helper
        shell: bash
        run: |
          # Framework-dependent and RID-neutral: one assembly serves every platform.
          dotnet publish src/activation-progress/ActivationProgress.csproj \
            --configuration Release -p:DebugType=None \
            --output src/eplugin-framework/addons/ePlugin/progress

      - name: Smoke test progress helper
        run: |
          # Verify the exact files that ship in the release archive.
          test "$(find src/eplugin-framework/addons/ePlugin/progress -maxdepth 1 -type f -name 'ActivationProgress.*' | wc -l)" -eq 2
          xvfb-run --auto-servernum "$RUNNER_TEMP/dotnet-tools/dotnet" run tools/progress_smoke.cs -- \
            dotnet src/eplugin-framework/addons/ePlugin/progress/ActivationProgress.dll

      - name: Create artifact
        shell: bash
        run: |
          # The same packaging as local test builds; it ships the helper smoke-tested above and verifies the archive.
          "$RUNNER_TEMP/dotnet-tools/dotnet" run tools/package_release.cs -- out \
            --name "ePlugin-v${VERSION}.zip" --helper src/eplugin-framework/addons/ePlugin/progress

      - name: Build Changelog
        id: build_changelog
        uses: mikepenz/release-changelog-builder-action@aa013739bbc8e7067dbbecd4525ff11aeb51a84b # v6.4.0
        with:
          mode: "HYBRID"
          configurationJson: |
            {
               "template": "#{{CHANGELOG}}\n",
               "categories": [
                 {
                     "title": "## Feature",
                     "labels": ["feat", "feature"]
                 },
                 {
                     "title": "## Fix",
                     "labels": ["fix", "bug"]
                 },
                 {
                     "title": "## Other",
                     "labels": []
                 }
               ],
               "ignore_labels": [
                 "ignore"
               ],
               "label_extractor": [
                 {
                   "pattern": "^(build|chore|ci|docs|feat|fix|perf|refactor|revert|style|test){1}(\\([\\w\\-\\.]+\\))?(!)?: ([\\w ])+([\\s\\S]*)",
                   "on_property": "title",
                   "target": "$1"
                 }
               ],
              "tag_resolver": {
                "method": "semver",
                "filter": {
                  "pattern": "v(.+)",
                  "flags": "gu"
                }
              }
             }
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Release
        uses: ncipollo/release-action@339a81892b84b4eeb0f6e744e4574d79d0d9b8dd # v1
        with:
          tag: ${{ github.ref_name }}
          name: "ePlugin-v${{ env.VERSION }}"
          body: ${{ steps.build_changelog.outputs.changelog }}
          token: ${{ secrets.GITHUB_TOKEN }}
          draft: true
          artifacts: "out/ePlugin-v${{ env.VERSION }}.zip"

[plugin]

name="ePlugin"
description="Declarative setup for C# editor plugins: ePlugins declare the NuGet packages, C# projects, autoloads, directories and plugin dependencies they need, installed on enable and removed on disable. The ePlugin Manager updates any add-on from GitHub, GitLab, Git or local ZIPs, with rollback, license acceptance and welcome pages."
author="Enaweg"
version="0.10.0"
script="EPluginPlugin.cs"

update_url="https://github.com/enaweg/godot-epluginframework/releases"
documentation_url="https://github.com/enaweg/godot-epluginframework#documentation"
source_url="https://github.com/enaweg/godot-epluginframework"
